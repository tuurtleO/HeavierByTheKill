# Heavier by the Kill - balance configuration
# Restart the mod controller after saving changes. Progress is stored separately.
# Decimal fractions use a dot. Invalid values fall back to safe defaults.

# OBS BROWSER OVERLAY
# Add http://127.0.0.1:27361/ as an OBS Browser Source sized 430 x 492.
# The server listens only on this computer. Set enabled to 0 to disable it.
obs_overlay_enabled=1
obs_overlay_port=27361

# WEIGHT GAIN AND LOSS
# Ordinary-kill gain before the weapon-type adjustment. Daggers gain 1.30x,
# light weapons 1.15x, standard 1.00x, heavy 0.85x, and colossal 0.72x.
weight_per_kill=1.0
boss_weight=12.0
boss_permanent_fraction=0.35
# 0.40 removes 40% of temporary weight on each bonfire rest.
rest_decay_fraction=0.40

# DAMAGE AND COMMITMENT
# Multipliers shown in the HUD use 1.00 as the unmodified game value.
base_damage_multiplier=0.62
base_attack_speed_multiplier=1.15
damage_per_weight=0.045
# Adds an accelerating term: this value multiplied by weight squared.
# At the default, damage gained by the next Standard-weapon kill rises from
# about +0.045x when fresh to +0.072x near 38 weight and +0.115x near 100.
# Set to 0 for the old purely linear damage curve.
damage_acceleration_per_weight_squared=0.00035
# Lower values make speed, stamina, and recovery penalties grow more slowly.
speed_loss_per_weight=0.010
stamina_per_weight=0.018
recovery_per_weight=0.014
impact_per_weight=0.050

# WEAPON-TYPE PENALTY ADJUSTMENTS
# Standard weapons take 15% less weight-derived stamina penalty.
# Set this to 1.00 to use the global stamina curve without an adjustment.
standard_stamina_penalty_multiplier=0.85
# Final caps, applied after boss-legacy penalties as well.
minimum_attack_speed_multiplier=0.40
maximum_stamina_cost_multiplier=4.00

# HEAVY-WEAPON EFFECTS
knockback_starts_at=18.0
knockback_per_weight=0.075
radial_stagger_starts_at=35.0
radial_radius_per_weight=0.060
camera_shake_starts_at=20.0

# HUD WEIGHT CLASSES
# Each value is the weight at which the named class begins. Keep them ordered.
# If they are out of order, the mod safely raises later values to match.
tier_tempered_at=15.0
tier_burdened_at=35.0
tier_crushing_at=65.0
tier_devastating_at=105.0
tier_worldbreaker_at=160.0
tier_cataclysmic_at=240.0
